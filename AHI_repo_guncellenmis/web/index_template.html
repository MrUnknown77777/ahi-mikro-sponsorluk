<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NSosyal — AHİ Sponsorluk</title>
<style>
:root{
  /* Zemin kademeleri: derinden yüzeye beş basamak.
     Tek bir gri yerine hafif mavi doygunluk korunur; NSosyal'in koyu
     arayüzüyle akraba durur. */
  --bg:#080E18; --surface:#111A27; --surface-2:#16202E; --raise:#1C2836;
  --line:#22303F; --line-2:#2E3D4F;

  /* Birincil vurgu: NSosyal mavisi. Eylem ve seçim için. */
  --accent:#2E9BFF; --accent-2:#5AB2FF; --accent-dim:#1B5E96;
  --accent-soft:rgba(46,155,255,.12);

  /* İkincil vurgu: pirinç. Ahilik geleneğinin el işçiliği ve
     lonca mührü çağrışımı; ayni (ürün karşılığı) kampanyaları
     nakitten ayırmak için kullanılır. */
  --brass:#C9962E; --brass-2:#E0B054; --brass-soft:rgba(201,150,46,.13);

  --text:#E8EFF7; --muted:#93A4B8; --faint:#6A7B8E;
  --ok:#41B954; --ok-soft:rgba(65,185,84,.12);
  --warn:#E8A33C; --warn-soft:rgba(232,163,60,.12);
  --risk:#E2564D; --risk-soft:rgba(226,86,77,.12);
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;font-family:inherit}
select,input,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:5px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- NSosyal kabuğu ---------- */
.ns{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.nsrail{background:var(--surface);border-right:1px solid var(--line);padding:18px 16px;
  display:flex;flex-direction:column;gap:5px}
.nslogo{display:flex;align-items:center;gap:8px;padding:4px 10px 16px}
.nslogo .n{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(135deg,#2E9BFF,#7A5CFF);font-weight:800;font-size:17px;color:#fff}
.nslogo .b{font-size:11px;color:var(--faint);letter-spacing:.14em;margin-top:9px}
.nsitem{display:flex;gap:12px;align-items:center;padding:9px 11px;border-radius:9px;
  font-size:14.5px;color:var(--muted);background:none;border:0;width:100%;text-align:left}
.nsitem:hover{background:var(--surface-2);color:var(--text)}
.nsitem.ahi{margin-top:10px;border:1px solid var(--accent);color:var(--accent);font-weight:600}
.nsitem.ahi:hover{background:#12263A}
.nsdot{width:18px;text-align:center;opacity:.8}
.nsuser{margin-top:auto;border-top:1px solid var(--line);padding-top:13px;font-size:13px;color:var(--muted)}
.feed{padding:22px 30px;max-width:640px}
.post{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 17px;margin-bottom:12px}
.post .hd{display:flex;gap:10px;align-items:center;margin-bottom:9px}
.post .av{width:36px;height:36px;border-radius:50%;background:var(--raise);flex:none}
.post .nm{font-weight:600;font-size:14px}
.post .hn{font-size:12.5px;color:var(--faint)}
.post .tx{font-size:14px}
.post .im{height:150px;background:linear-gradient(135deg,#17222F,#1C2A3A);border-radius:9px;margin-top:11px}
.post .ac{display:flex;gap:22px;margin-top:11px;font-size:12.5px;color:var(--faint)}

/* ---------- AHİ giriş ---------- */
.gate{min-height:100vh;display:grid;place-items:center;padding:40px 20px}
.gatebox{width:100%;max-width:560px}
.gatehd{text-align:center;margin-bottom:24px}
.gatehd .mk{font-size:30px;font-weight:700;letter-spacing:.16em;color:var(--accent)}
.gatehd .sb{font-size:13.5px;color:var(--muted);margin-top:4px}
.rolegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.rolecard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;text-align:left}
.rolecard[aria-pressed=true]{border-color:var(--accent);background:#12263A}
.rolecard .t{font-weight:600;font-size:15px}
.rolecard .d{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.crit{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:17px}
.critrow{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;margin-bottom:8px}
.critrow .ic{width:17px;flex:none;text-align:center;font-weight:700}
.critrow:last-child{margin-bottom:0}
.twofa{display:flex;gap:9px;justify-content:center;margin:14px 0}
.twofa input{width:46px;height:54px;text-align:center;font-size:21px;font-weight:600;
  background:var(--bg);border:1px solid var(--line-2);border-radius:9px;color:var(--text);
  transition:border-color .15s}
.twofa input:focus{border-color:var(--accent)}
.twofa input.tferr{border-color:var(--risk)}

/* ---------- AHİ uygulama kabuğu ---------- */
.app{display:grid;grid-template-columns:238px 1fr;min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:18px 15px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:baseline;gap:8px;padding:2px 9px 14px}
.brand .mark{font-size:19px;font-weight:700;letter-spacing:.15em;color:var(--accent)}
.brand .sub{font-size:10.5px;color:var(--faint)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;gap:11px;align-items:center;padding:8px 11px;border-radius:8px;
  font-size:14px;color:var(--muted);background:none;border:0;width:100%;text-align:left}
.nav button:hover{background:var(--surface-2);color:var(--text)}
.nav button.on{background:var(--raise);color:var(--text);font-weight:500}
.nav .ic{width:16px;text-align:center;opacity:.85}
.navgrp{font-size:10.5px;color:var(--faint);letter-spacing:.05em;padding:13px 11px 4px}
.who{margin-top:auto;border-top:1px solid var(--line);padding-top:12px}
.who .r{font-size:10.5px;color:var(--accent);letter-spacing:.05em}
.who .n{font-size:13.5px;font-weight:600;margin-top:2px}
.who .c{font-size:12px;color:var(--muted)}
.who button{margin-top:9px;font-size:12px;color:var(--muted);background:none;border:1px solid var(--line-2);
  border-radius:6px;padding:5px 9px;width:100%}
.main{padding:26px 34px 56px;max-width:1140px}
.head{margin-bottom:19px}
.head h1{font-size:22px;font-weight:650;margin:0 0 4px;letter-spacing:-.01em}
.head p{margin:0;color:var(--muted);font-size:13.5px;max-width:76ch}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel+.panel{margin-top:12px}
.row{display:flex;gap:13px;align-items:center}
.sp{flex:1}
.btn{background:var(--accent);border:none;border-radius:8px;padding:10px 17px;font-weight:600;font-size:14px;color:#04121F}
.btn:hover{background:var(--accent-2)}
.btn.ghost{background:transparent;border:1px solid var(--line-2);color:var(--text);font-weight:500}
.btn.ghost:hover{border-color:var(--accent)}
.btn.sm{padding:7px 13px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
textarea,input[type=text],select{width:100%;background:var(--bg);border:1px solid var(--line-2);
  border-radius:8px;color:var(--text);padding:11px 12px;font:inherit;resize:vertical}
textarea:focus,input:focus,select:focus{border-color:var(--accent);outline:none}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
h3.sec{font-size:13.5px;margin:0 0 9px;font-weight:600}
.lbl{font-size:12.5px;color:var(--muted);display:block;margin-bottom:5px}
.tag{display:inline-flex;font-size:11px;padding:2px 7px;border-radius:5px;border:1px solid var(--line-2);color:var(--muted)}
.tag.ok{color:var(--ok);border-color:#22502F;background:var(--ok-soft)}
.tag.brass{color:var(--brass-2);border-color:#5A4518;background:var(--brass-soft)}
.tag.warn{color:var(--warn);border-color:#4D3A18;background:var(--warn-soft)}
.tag.risk{color:var(--risk);border-color:#502624;background:var(--risk-soft)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* ---------- kampanya kartları ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.kpi{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:13px}
.kpi .n{font-size:21px;font-weight:650;font-variant-numeric:tabular-nums}
.kpi .l{font-size:11.5px;color:var(--muted);margin-top:2px}
.camp{display:grid;grid-template-columns:1fr 130px 120px 110px 92px;gap:14px;align-items:center;
  padding:13px 15px;border-bottom:1px solid var(--line);font-size:13.5px}
.camp:last-child{border-bottom:none}
.camp .t{font-weight:600}
.camp .s{font-size:12px;color:var(--muted);margin-top:1px}
.camp .num{font-variant-numeric:tabular-nums;text-align:right}
.listbox{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.listhd{display:grid;grid-template-columns:1fr 130px 120px 110px 92px;gap:14px;padding:9px 15px;
  background:var(--raise);font-size:11.5px;color:var(--muted);font-weight:600}
.listhd .num{text-align:right}

/* ---------- işlem şeridi ---------- */
.strip{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:11px 14px;
  font-size:12.5px;color:var(--muted);margin-bottom:13px}
.strip .g{display:flex;gap:18px;flex-wrap:wrap;margin-top:7px}
.strip .g span{color:var(--faint)}
.strip .g b{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.strip summary{cursor:pointer;color:var(--text);font-weight:500;font-size:13px}

/* ---------- eşleşme listesi ---------- */
.list{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:grid;grid-template-columns:26px 1fr 258px 68px;gap:16px;align-items:center;
  padding:13px 15px;background:var(--surface);border:0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.item:last-child{border-bottom:none}
.item:hover{background:var(--surface-2)}
.rank{font-size:12.5px;color:var(--faint);text-align:center}
.who2 .h{font-weight:600;font-size:14px;display:block}
.who2 .m{font-size:12.5px;color:var(--muted);margin-top:2px;display:block}
.who2 .q{font-size:12.5px;color:var(--faint);margin-top:5px;font-style:italic;display:block;max-width:48ch}
.bars{display:grid;gap:5px}
.bar{display:grid;grid-template-columns:90px 1fr 24px;gap:8px;align-items:center;font-size:11px;color:var(--muted);white-space:nowrap}
.track{display:block;height:6px;background:#22303F;border-radius:3px;overflow:hidden}
.fill{display:block;height:100%;background:var(--accent);border-radius:3px}
.fill.low{background:var(--risk)} .fill.mid{background:var(--warn)}
.bar .v{text-align:right;color:var(--text);font-variant-numeric:tabular-nums}
.score{text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.score .big{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.05}
.score .lbl2{font-size:10.5px;color:var(--faint)}
.chk{width:17px;height:17px;accent-color:var(--accent)}

.cmp{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.cmp h3{font-size:13.5px;margin:0 0 6px;font-weight:600}
.cmp .note{font-size:12px;color:var(--muted);margin:0 0 11px}
.cmp ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.cmp li{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;
  font-size:13px;display:flex;gap:10px;align-items:center;min-height:46px}
.cmp li .r{color:var(--faint);font-size:12px;width:14px;flex:none}
.cmp li.flag{border-color:#502624;background:#1B1517}
.dusus{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--risk);
  white-space:nowrap;background:var(--risk-soft);border:1px solid #502624;
  border-radius:6px;padding:3px 8px;margin-left:auto}
.dusus .ok2{font-size:13px;line-height:1}
.kanitgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin:12px 0}
.kanitgrid > div{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:12px}
.kn{font-size:19px;font-weight:650;font-variant-numeric:tabular-nums}
.kl{font-size:11.5px;color:var(--muted);margin-top:2px}
.kw{font-size:11px;color:var(--risk);margin-top:4px}

.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:15px;align-items:start}
.bigbar{display:grid;grid-template-columns:124px 1fr 34px 168px;gap:11px;align-items:center;font-size:13.5px;margin-bottom:10px}
.bigbar.off{opacity:.4}
.bigbar.off .track{background:#1B2532}
.bigbar .track{height:9px;border-radius:5px}
.bigbar .v{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.bigbar .w{font-size:11.5px;color:var(--faint);white-space:nowrap}
.posts{display:flex;flex-direction:column;gap:8px}
.posts div{font-size:13px;color:var(--muted);border-left:2px solid var(--line-2);padding-left:11px}
.price{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:14px}
.price .amt{font-size:19px;font-weight:650;color:var(--accent)}
.price.barter{border-color:#4A3A18;background:var(--brass-soft)}
.price.barter .amt{color:var(--brass-2)}

/* ---------- uyum ---------- */
.prev{background:var(--bg);border:1px solid var(--line-2);border-radius:10px;padding:14px}
.prev .ph{display:flex;gap:9px;align-items:center;margin-bottom:9px}
.prev .av{width:32px;height:32px;border-radius:50%;background:var(--raise)}
.prev .im{height:120px;background:linear-gradient(135deg,#17222F,#1C2A3A);border-radius:8px;margin-top:10px;
  display:grid;place-items:center;color:var(--faint);font-size:12px}
.badge{display:inline-block;padding:3px 9px;border-radius:5px;font-size:12px;font-weight:600;margin-bottom:8px}
.badge.bad{background:#2A1614;color:var(--risk);border:1px solid #502624}
.badge.good{background:#12281A;color:var(--ok);border:1px solid #22502F}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;margin-bottom:9px}
.check .ic{width:16px;flex:none;font-weight:700;text-align:center}
.check .d{font-size:12px;color:var(--faint);margin-top:1px}
.karsit{display:grid;grid-template-columns:1fr 26px 1fr;gap:9px;align-items:center;margin:14px 0}
.kt{border-radius:9px;padding:12px;border:1px solid var(--line)}
.kt.bad{border-color:#502624;background:var(--risk-soft)}
.kt.good{border-color:#22502F;background:var(--ok-soft)}
.kh{font-size:11px;color:var(--muted);margin-bottom:5px}
.kv2{font-weight:600;font-size:13.5px;line-height:1.35}
.kt.bad .kv2{color:var(--risk);text-decoration:line-through;text-decoration-thickness:1px}
.kt.good .kv2{color:var(--ok)}
.kn2{font-size:11px;color:var(--faint);margin-top:6px}
.kok{text-align:center;color:var(--faint);font-size:17px}
@media (max-width:880px){.karsit{grid-template-columns:1fr;gap:6px}.kok{transform:rotate(90deg)}}
.law{background:var(--surface-2);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;
  padding:11px 13px;font-size:12.5px;color:var(--muted);margin-top:11px}
.law b{color:var(--text);font-weight:600}

/* ---------- rapor ---------- */
.chartbox{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:14px}
.chartbox h4{font-size:12.5px;margin:0 0 10px;font-weight:600;color:var(--muted)}
.dem{display:grid;gap:7px}
.demrow{display:grid;grid-template-columns:78px 1fr 40px;gap:9px;align-items:center;font-size:12px;color:var(--muted)}
.demrow .v{text-align:right;color:var(--text);font-variant-numeric:tabular-nums}
table.rep{width:100%;border-collapse:collapse;font-size:13px}
table.rep th,table.rep td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
table.rep th{color:var(--muted);font-size:11.5px;font-weight:600}
table.rep td.num{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- veri kaynağı ---------- */
.tblwrap{border:1px solid var(--line);border-radius:9px;overflow:hidden}
.tblscroll{max-height:440px;overflow:auto}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
table.data th{position:sticky;top:0;background:var(--raise);color:var(--muted);font-weight:600;font-size:11.5px;z-index:1}
table.data td.num{font-variant-numeric:tabular-nums;text-align:right}
table.data tr:hover td{background:var(--surface-2)}
.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:11px}
.filters select,.filters input{width:auto;min-width:150px;padding:8px 10px;font-size:13px}
.src{font-size:11.5px;color:var(--faint);margin-top:11px;line-height:1.65}

.offers{display:flex;flex-direction:column;gap:9px}
.offer{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:13px 15px}
.offer.new{border-color:var(--accent)}
.offer .t{font-weight:600;font-size:13.5px}
.offer .m{font-size:12.5px;color:var(--muted);margin-top:2px}
.prefs{display:flex;flex-wrap:wrap;gap:7px}
.prefs button{font-size:12px;padding:5px 10px;border-radius:6px;border:1px solid var(--line-2);
  background:var(--surface-2);color:var(--muted)}
.prefs button[aria-pressed=true]{border-color:var(--risk);color:var(--risk)}
table.kv{width:100%;font-size:13.5px}
table.kv td{padding:5px 0;vertical-align:top}
table.kv td:first-child{color:var(--muted);width:200px}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .i{font-size:30px;opacity:.35;margin-bottom:9px}

@media print{
  body{background:#fff;color:#111}
  .rail,.noprint{display:none!important}
  .app{grid-template-columns:1fr}
  .main{padding:0;max-width:none}
  .panel,.chartbox,.kpi{background:#fff;border-color:#ccc;break-inside:avoid}
  .head h1{color:#111}
  .head p,.hint,.src,.muted{color:#444}
  .kpi .n,.score .big{color:#111}
}

/* ================= Mobil duyarlı tasarım ================= */
@media (max-width: 880px){
  .ns{grid-template-columns:1fr}
  .nsrail{display:none}
  .feed{padding:14px 14px 70px}

  .gate{padding:20px 14px}
  .rolegrid{grid-template-columns:1fr}

  .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .rail{position:fixed;bottom:0;left:0;right:0;top:auto;width:100%;height:auto;
    flex-direction:row;align-items:center;padding:8px 6px;border-right:0;
    border-top:1px solid var(--line);z-index:20;gap:0}
  .rail .brand{display:none}
  .rail .nav{flex-direction:row;flex:1;justify-content:space-around}
  .rail .nav button{flex-direction:column;gap:3px;padding:6px 4px;font-size:10px;
    text-align:center;border-radius:8px}
  .rail .nav .ic{font-size:17px}
  .rail .who{display:none}
  .main{padding:16px 14px 84px;max-width:none}
  .head h1{font-size:19px}

  .grid2{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .scn{grid-template-columns:1fr}
  .ctgrid{grid-template-columns:1fr 1fr}
  .cmp{grid-template-columns:1fr;gap:16px}

  /* satır düzeni tabloları / ızgaraları dikey kart görünümüne çevir */
  .item,.camp,.listhd{grid-template-columns:1fr!important}
  .listhd{display:none}
  .item{gap:8px}
  .item .rank{display:none}
  .item .score{flex-direction:row;justify-content:space-between;align-items:baseline}
  .camp{gap:5px;padding:12px}
  .camp > div:not(:first-child)::before{content:attr(data-lbl) ": ";color:var(--faint);font-size:11px}

  .bigbar{grid-template-columns:1fr!important;gap:4px}
  .bigbar .w{grid-column:1}

  .filters{flex-direction:column}
  .filters select,.filters input{width:100%;min-width:0}
  table.data{font-size:11.5px}
  .tblscroll{max-height:340px}

  .twofa input{width:38px;height:48px;font-size:18px}
  .gatebox{max-width:100%}
}
/* ---------- İçerik türü seçimi ----------

<script>
const D=JSON.parse(document.getElementById('ahi-data').textContent);
const STOP=new Set(D.stopwords);
const TRM={'I':'ı','İ':'i','Ş':'ş','Ğ':'ğ','Ü':'ü','Ö':'ö','Ç':'ç'};
/* \w Latin harfleriyle sınırlıdır; Türkçe harfler kapsam dışında kalır ve
   "#işbirliği" gibi etiketler parçalanır. Kalıplara Türkçe harfler eklenir. */
const TRW='A-Za-z0-9_çğıöşüÇĞİÖŞÜ';
const normTr=s=>s.replace(/https?:\/\/\S+/g,' _url_ ')
  .replace(new RegExp('@['+TRW+']+','g'),' _mention_ ')
  .replace(new RegExp('#(['+TRW+']+)','g'),' $1 ')
  .replace(/[IİŞĞÜÖÇ]/g,c=>TRM[c]).toLowerCase()
  .replace(/[^\wçğıöşü\s]/gu,' ').replace(/\s+/g,' ').trim();

/* Türkçe eklemeli bir dildir: "gümüşten", "müzisyenlere" gibi çekimli biçimler
   sözlükte kök hâliyle bulunur. Sözlükte karşılığı olmayan belirteç için
   kademeli olarak ekler atılarak kök aranır. Tam bir biçimbilimsel çözümleyici
   değildir; en az dört karakter kuralıyla yanlış kök riski sınırlanır. */
const KOK_MIN=4;
function kokBul(t){
  if(D.vocab[t]!==undefined)return t;
  for(let n=t.length-1;n>=KOK_MIN;n--){const k=t.slice(0,n);if(D.vocab[k]!==undefined)return k;}
  return t;
}
const toks=s=>normTr(s).split(' ').filter(t=>t.length>1&&!STOP.has(t)).map(kokBul).filter(t=>!STOP.has(t));
function vectorize(t){const tf={};for(const k of toks(t)){const i=D.vocab[k];if(i!==undefined)tf[i]=(tf[i]||0)+1;}
  const v={};let n=0;for(const i in tf){const w=(1+Math.log(tf[i]))*D.idf[i];v[i]=w;n+=w*w;}
  n=Math.sqrt(n)||1;for(const i in v)v[i]/=n;return v;}
const cos=(a,b)=>{let s=0;for(const i in a)if(b[i]!==undefined)s+=a[i]*b[i];return s;};

/* Anlamsal uyum alt sınırı.
   Spor içeriği üreten bir hesabın kahve reklamı yapması, kitle kalitesi ne
   olursa olsun yanlış eşleşmedir. Bu nedenle anlamsal uyum bir eşiğin altında
   kalan üretici listeden tamamen çıkarılır; diğer bileşenlerle telafi edilemez. */
const ANLAMSAL_ALT_SINIR = 45;

/* Coğrafi yakınlık.
   Önceki sürümde şehir seçildiğinde havuz sert biçimde filtreleniyordu; bu
   durumda kalan her adayın coğrafi skoru 100 olduğu için ağırlık sıralamayı
   hiç ayırt etmiyordu. Artık aynı şehir tam puan, komşu iller kademeli puan
   alır. Kullanıcı isterse katı kısıt uygulanır. */
const KOMSU_IL = {
  'İstanbul':['Bursa','Kocaeli','Tekirdağ'], 'Ankara':['Eskişehir','Konya','Kayseri'],
  'İzmir':['Manisa','Aydın','Muğla'], 'Bursa':['İstanbul','Eskişehir','Balıkesir'],
  'Antalya':['Muğla','Konya','Isparta'], 'Konya':['Ankara','Antalya','Karaman'],
  'Gaziantep':['Adana','Şanlıurfa','Kahramanmaraş'], 'Trabzon':['Rize','Giresun','Samsun'],
  'Eskişehir':['Ankara','Bursa','Kütahya'], 'Denizli':['Muğla','Aydın','Manisa'],
  'Samsun':['Trabzon','Ordu','Amasya'], 'Muğla':['İzmir','Antalya','Denizli'],
  'Kayseri':['Ankara','Konya','Sivas'], 'Adana':['Gaziantep','Mersin','Hatay'],
};
function geoSkor(sehir, hedef){
  if(!hedef) return 100;
  if(sehir===hedef) return 100;
  const k=KOMSU_IL[hedef]||[];
  if(k.includes(sehir)) return 72;
  return 35;
}

const W={shipped:{semantic:.42,audience:.26,safety:.16,budget:.16,geo:0},
         local:{semantic:.32,audience:.20,safety:.13,budget:.10,geo:.25}};
const LBL={semantic:'Anlamsal uyum',audience:'Kitle kalitesi',safety:'Marka güvenliği',
           budget:'Bütçe uyumu',geo:'Coğrafi yakınlık'};

const CENTROIDS=(()=>{const acc={},cnt={};
  for(const c of D.creators){if(!acc[c.niche]){acc[c.niche]={};cnt[c.niche]=0;}
    for(const i in c.vec)acc[c.niche][i]=(acc[c.niche][i]||0)+c.vec[i];cnt[c.niche]++;}
  for(const n in acc){let s=0;for(const i in acc[n]){acc[n][i]/=cnt[n];s+=acc[n][i]*acc[n][i];}
    s=Math.sqrt(s)||1;for(const i in acc[n])acc[n][i]/=s;}return acc;})();

const Z_ESIGI=2.2,MUTLAK_TABAN=0.012,MIN_ESLESME=2;
function nisBul(text){
  const q=vectorize(text);
  const eslesen=toks(text).filter(t=>D.vocab[t]!==undefined);
  const benzersiz=new Set(eslesen).size;
  const sk=[];for(const n in CENTROIDS)sk.push([n,cos(q,CENTROIDS[n])]);
  sk.sort((a,b)=>b[1]-a[1]);
  const vals=sk.map(x=>x[1]),ort=vals.reduce((a,b)=>a+b,0)/vals.length;
  const sd=Math.sqrt(vals.reduce((a,b)=>a+(b-ort)*(b-ort),0)/vals.length)||1e-9;
  const z=(vals[0]-ort)/sd;
  return{nis:sk[0][0],skor:vals[0],z:z,ikinciNis:sk[1][0],eslesme:benzersiz,
         kapsamDisi:(z<Z_ESIGI||vals[0]<MUTLAK_TABAN||benzersiz<MIN_ESLESME)};
}

/* İçerik türüne güvenli erişim. Hazır senaryolar ve eski kayıtlarda bu alan
   bulunmayabilir; tanımsız değer okumak arayüzü çökertir. */
function ctAl(k){ return D.contentTypes[k] || D.contentTypes['gorsel']; }
function ctKod(k){ return D.contentTypes[k] ? k : 'gorsel'; }

const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const cls=v=>v<40?'low':(v<70?'mid':'');
const nf=n=>Math.round(n).toLocaleString('tr-TR');
const ms=v=>v<1?v.toFixed(2)+' ms':v.toFixed(1)+' ms';
/* Seçilen içerik türüne göre fiyat aralığı. Üretici o türü üretemiyorsa
   üretebildiği en yakın tür esas alınır. */
function fiyatAl(c,tur){
  if(c.prices&&c.prices[tur])return c.prices[tur];
  if(c.prices){const ilk=Object.keys(c.prices)[0];return c.prices[ilk];}
  return [c.priceLo,c.priceHi];
}
const bFit=(c,b,tur)=>{if(!b)return 100;
  const [lo,hi]=fiyatAl(c,tur);
  const ov=Math.max(0,Math.min(hi,b[1])-Math.max(lo,b[0]));
  return Math.min(100,ov/Math.max(1,hi-lo)*100);};

function pipeline(scn,all){
  const t={};let s=performance.now();
  const q=vectorize(scn.text+' '+scn.niche);t.vec=performance.now()-s;
  s=performance.now();
  // Coğrafi kısıt seçilmişse havuz önce şehre göre daraltılır: kullanıcı
  // "yalnızca X" dediğinde başka şehirden üretici gösterilmesi çelişki olurdu.
  /* Zorunlu koşullar (hard constraint) ile sıralama ölçütleri (ranking) ayrılır.
     Zorunlu koşullar: istenen içerik türünü üretebilmek, üreticinin o kategoriyi
     kapatmamış olması ve katı coğrafi kısıt seçildiyse aynı şehirde olmak. */
  let havuz=D.creators;
  if(scn.contentType) havuz=havuz.filter(c=>!c.contentTypes||c.contentTypes.includes(scn.contentType));
  if(scn.city && scn.katiGeo) havuz=havuz.filter(c=>c.city===scn.city);
  // Üreticinin teklif almak istemediği kategoriler eşleştirme katmanında elenir
  if(S.rejected&&S.rejected.length) havuz=havuz.filter(c=>!S.rejected.includes(c.niche));
  const sims=havuz.map(c=>cos(q,c.vec));t.sim=performance.now()-s;
  s=performance.now();const sorted=sims.map((v,i)=>[v,i]).sort((a,b)=>b[0]-a[0]);
  const idx=all?sorted:sorted.slice(0,150);t.ret=performance.now()-s;
  if(!idx.length){t.total=0;t.scanned=havuz.length;t.pool=0;t.elenen=0;return{list:[],t};}
  s=performance.now();
  const lo=idx[idx.length-1][0],hi=idx[0][0],sp=(hi-lo)||1;
  const w=scn.city?W.local:W.shipped;
  const out=idx.map(([v,i])=>{const c=havuz[i];
    const comp={semantic:(v-lo)/sp*100,audience:c.audience,safety:c.safety,
                budget:bFit(c,scn.budget,scn.contentType),geo:geoSkor(c.city,scn.city)};
    let tot=0;for(const k in w)tot+=w[k]*comp[k];
    tot+=(S.learned[c.id]||0);if(c.uncertain)tot-=1.5;
    tot=Math.max(0,Math.min(100,tot));
    return{c,comp,w,total:Math.round(tot*10)/10,
           elendi:comp.semantic<ANLAMSAL_ALT_SINIR};});
  const elenen=out.filter(r=>r.elendi).length;
  const kalan=out.filter(r=>!r.elendi);
  kalan.sort((a,b)=>b.total-a.total);t.rank=performance.now()-s;
  t.elenen=elenen;
  t.total=t.vec+t.sim+t.ret+t.rank;t.scanned=havuz.length;t.pool=idx.length;
  return{list:kalan,t};
}
const naive=scn=>D.creators.filter(c=>c.niche===scn.niche)
  .sort((a,b)=>(b.followers*b.engagement)-(a.followers*a.engagement)).slice(0,6);
/* Açıklanabilirlik: iki vektörün kosinüs benzerliğine en çok katkı yapan terimler.
   Katkı = brif ağırlığı × üretici ağırlığı. Gerçek hesaptan çıkarılır. */
const TERS_VOCAB=(()=>{const r={};for(const t in D.vocab)r[D.vocab[t]]=t;return r;})();
function ortakTerimler(briefText,creator,n){
  const q=vectorize(briefText);const katki=[];
  for(const i in q){if(creator.vec[i]!==undefined)katki.push([TERS_VOCAB[i],q[i]*creator.vec[i]]);}
  katki.sort((a,b)=>b[1]-a[1]);
  return katki.slice(0,n||6);
}
const miniBars=c=>['semantic','audience','safety','budget'].map(k=>{const v=Math.round(c[k]);
  return`<div class="bar"><span>${LBL[k]}</span><span class="track">
  <span class="fill ${cls(v)}" style="width:${v}%"></span></span><span class="v">${v}</span></div>`;}).join('');

  brandName:'İşletme Hesabım', eligInputs:{followers:'',age:'',engagement:''},
  draft:{text:'',niche:null,city:null,campaign:'barter',budget:null,contentType:'gorsel',notes:'',katiGeo:false,
         barterItem:'ürününüzden bir örnek',barterValue:1500},
  detect:null,ranked:[],t:null,chosen:null,compare:false,
  selected:[],learned:{},relearned:false,rejected:[],label:'',checked:false,
  campaigns:JSON.parse(JSON.stringify(D.campaigns)),dataFilter:{niche:'',city:'',q:''},openCampaign:null,kanit:null,aktifKampanya:null,acikIs:null,hesapAcik:false,
  uretilenIcerik:null,onayNotu:'',onayDurumu:null};

/* ---------------- kalıcılık: localStorage ---------------- */
const LS_KEY='ahi_demo_state_v5';
function kaydet(){
  try{
    const snap={role:S.role,brandName:S.brandName,draft:S.draft,campaigns:S.campaigns,
      rejected:S.rejected,learned:S.learned,view:S.view};
    localStorage.setItem(LS_KEY, JSON.stringify(snap));

}
function yukle(){

    const raw=localStorage.getItem(LS_KEY);

}
function sifirla(){

  location.reload();
}

          <div class="critrow" style="margin-top:11px">

            <span>Hesap yaşı — en az 1 ay aktif olmalı</span></div>
          ${isC?`<div class="critrow">
            <span class="ic" style="color:${followers>=1000?'var(--ok)':(f.followers?'var(--risk)':'var(--faint)')}">${followers>=1000?'✓':(f.followers?'✕':'○')}</span>
            <span>Takipçi sayısı — en az 1.000 olmalı</span></div>
          <div class="critrow">
            <span class="ic" style="color:${eng>=1.5?'var(--ok)':(f.engagement?'var(--risk)':'var(--faint)')}">${eng>=1.5?'✓':(f.engagement?'✕':'○')}</span>
            <span>Etkileşim oranı — en az %1,5 olmalı</span></div>`:''}
        </div>
        <div class="row" style="margin-top:14px">
          <button class="btn ghost" id="gBack">Geri</button><span class="sp"></span>
          <button class="btn" id="gNext2" ${hepsi?'':'disabled'}>Doğrulamaya geç</button></div>
      </div>
      <p class="hint" style="text-align:center">Koşullar, platformun sahte hesaplarla
      kullanılmasını önlemek için uygulanır.</p></div></div>`;
  }

  return`<div class="gate"><div class="gatebox">
    <div class="gatehd"><div class="mk">AHİ</div>
      <div class="sb">İki aşamalı doğrulama</div></div>
    <div class="panel">
      <h3 class="sec">Doğrulama kodu</h3>
      <p class="hint" style="margin-top:0">Kayıtlı telefonunuza gönderilen 6 haneli kodu girin.
      Ticari işlem yapılan bir bölüm olduğu için bu adım zorunludur.</p>
      <div class="twofa" id="twofa">${[0,1,2,3,4,5].map(i=>
        `<input type="text" inputmode="numeric" maxlength="1" id="c${i}"
          aria-label="Kod hanesi ${i+1}" value="${esc(S.code[i])}"
          class="${S.gateErr?'tferr':''}">`).join('')}</div>
      ${S.gateErr?`<p class="hint" style="color:var(--risk);text-align:center">
        Kod eksik veya hatalı. Lütfen 6 haneyi de doldurun.</p>`:''}
      <button class="btn" id="gVerify" style="width:100%">Doğrula ve giriş yap</button>
      <div class="row" style="margin-top:9px;gap:8px">

        <button class="btn ghost" id="gBack2" style="flex:1">Geri</button></div>
    </div></div></div>`;

}

function vCampDetail(){

  const steps=[
    ['Kampanya oluşturuldu',true,c.date],
    ['Üretici teklifi kabul etti',c.status!=='teklif bekliyor',c.status!=='teklif bekliyor'?c.date:'bekleniyor'],
    ['Yayın öncesi uyum kontrolü',c.status!=='teklif bekliyor',c.compliant?'uygun':(c.status!=='teklif bekliyor'?'uygun':'—')],
    ['İçerik yayımlandı',c.status==='yayında'||done,(c.status==='yayında'||done)?'yayında':'—'],

function vCompare(){
  const full=pipeline(S.draft,true).list,rk={};full.forEach((r,i)=>rk[r.c.id]=i+1);
  const nv=naive(S.draft);
  const L=nv.map((c,i)=>{const bad=c.audience<40,sira=rk[c.id]||null;
    const dusus=(bad&&sira)?sira-(i+1):null;
    return`<li class="${bad?'flag':''}" ${bad?`data-kanit="${esc(c.id)}"`:''}
      style="${bad?'cursor:pointer':''}">
      <span class="r">${i+1}</span>
      <span style="flex:1">@${esc(c.handle)}<br><span style="font-size:11.5px;color:var(--muted)">
      ${nf(c.followers)} takipçi · %${(c.engagement*100).toFixed(1)} etkileşim</span></span>
      ${bad?`<span class="dusus"><span class="ok2">↓</span><span>${dusus?dusus+' sıra':'geriye'}</span></span>`:''}</li>`;}).join('');
  const R=S.ranked.slice(0,6).map((r,i)=>`<li><span class="r">${i+1}</span>
    <span>@${esc(r.c.handle)}<br><span style="font-size:11.5px;color:var(--muted)">
    kitle kalitesi ${Math.round(r.comp.audience)} · uyum ${r.total}</span></span></li>`).join('');
  const k=S.kanit?D.creators.find(c=>c.id===S.kanit):null;
  return`<div class="cmp">
    <div><h3>Takipçi sayısına bakan bir araç</h3>
      <p class="note">En çok erişime sahip hesapları önerir.</p><ol>${L}</ol>
      ${nv.some(c=>c.audience<40)?`<p class="hint" style="margin-top:9px">
        Kırmızı satırlara tıklayıp gerekçeyi görebilirsiniz.</p>`:''}</div>
    <div><h3>AHİ</h3>
      <p class="note">İçerik uyumunu ve kitlenin gerçekliğini birlikte değerlendirir.</p>
      <ol>${R}</ol></div></div>
    ${k?`<div class="panel belir" style="margin-top:14px;border-color:var(--risk)">
      <div class="row"><h3 class="sec" style="margin:0">@${esc(k.handle)} neden geriye düştü</h3>
        <span class="sp"></span><button class="btn ghost sm" id="kanitKapat">Kapat</button></div>
      <div class="kanitgrid">
        <div><div class="kn">${nf(k.followers)}</div><div class="kl">takipçi</div></div>
        <div><div class="kn">%${(k.engagement*100).toFixed(0)}</div><div class="kl">etkileşim oranı</div>
          <div class="kw">olağandışı yüksek</div></div>
        <div><div class="kn">${k.engagerAgeMedian} ay</div><div class="kl">etkileşen hesapların yaşı</div>
          <div class="kw">çok yeni</div></div>
        <div><div class="kn">%${(k.spike*100).toFixed(0)}</div><div class="kl">takipçi sıçraması</div>
          <div class="kw">ani artış</div></div>
      </div>
      <p class="hint">Yüksek etkileşim tek başına iyi bir işaret değil. Bu hesapla etkileşen
      kullanıcıların çoğu yakın zamanda açılmış ve birbirine benzeyen hesaplar; takipçi sayısı
      da kısa sürede sıçramış. Sistem hesabı elemez, üst sıralara taşımaz.</p></div>`:''}`;
}


function vDetail(){
  const r=S.chosen,c=r.c;
  const bars=['semantic','audience','safety','budget','geo'].map(k=>{
    const v=Math.round(r.comp[k]),off=r.w[k]===0;
    return`<div class="bigbar${off?' off':''}"><span>${LBL[k]}</span>

/* ================= Yayın öncesi uyum ================= */
const KALDIRILAN=['işbirliği','isbirligi','sponsor','sponsorlu','hediye','teşekkür','collab','ad'];
function denetle(lbl,marka){
  const n=normTr(lbl),mk=normTr(marka).split(' ')[0];
  const markaVar=mk.length>2&&n.includes(mk);
  const serbest=KALDIRILAN.some(k=>n.includes(normTr(k)));
  const konum=true;
  return{markaVar,serbest,konum,uygun:markaVar&&!serbest&&konum};
}

function durumRozet(st){
  const renk={'teklif bekliyor':'warn','kabul edildi':'','içerik yüklendi':'',
              'revizyon istendi':'risk','onay bekliyor':'brass','tamamlandı':'ok'}[st]||'';
  return `<span class="tag ${renk}">${esc(st)}</span>`;
}

    ['İçeriği ürettim ve yükledim', DURUM_SIRA.indexOf(k.status)>=2, ''],
    ['Yayın öncesi uyum kontrolü', k.compliant===true, k.compliant?'uygun':'bekliyor'],

      (k.status==='tamamlandı'?'onaylandı':'bekliyor')],

  return`<div class="panel belir" style="margin-top:14px;border-color:var(--accent)">

/* ================= Rapor ================= */
function sparkline(vals,w,h){
  const mx=Math.max(...vals)||1,st=w/(vals.length-1);
  const pts=vals.map((v,i)=>`${(i*st).toFixed(1)},${(h-v/mx*(h-14)-4).toFixed(1)}`).join(' ');
  const area=`0,${h} `+pts+` ${w},${h}`;
  return`<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img"
    aria-label="Günlük erişim eğrisi"><polygon points="${area}" fill="rgba(46,155,255,.13)"/>
    <polyline points="${pts}" fill="none" stroke="#2E9BFF" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"/>
    ${vals.map((v,i)=>`<circle cx="${(i*st).toFixed(1)}" cy="${(h-v/mx*(h-14)-4).toFixed(1)}"
      r="2.5" fill="#2E9BFF"/>`).join('')}</svg>`;
}

/* ================= yönlendirme ================= */
const VIEWS={home:vHome,new:vNew,results:vResults,detail:vDetail,perf:vPerf,onay:vOnay,cwork:vCWork,
  cpanel:vCPanel,coffers:vCOffers,offer:vOffer,compliance:vCompliance,
  reports:vReport,data:vData};

function render(){
  const root=document.getElementById('root');
  // Sayfa yenilendiğinde hesaplanmış sonuçlar bellekte kalmaz; kullanıcıyı
  // boş ekranla karşılaştırmak yerine kampanya adımına geri alırız.
  /* Sonuç ekranı sayfa yenilendiğinde bellekteki sıralamayı kaybeder.
     Taslak duruyorsa yeniden hesaplanır. Hesap sonucu gerçekten boşsa
     kullanıcı kampanya adımına atılmaz; gerekçeli boş ekran gösterilir. */
  if((S.view==='results'||S.view==='detail')&&(!S.ranked||!S.ranked.length)){
    if(S.draft&&S.draft.text&&S.t===null){
      if(S.draft.niche){const r=pipeline(S.draft);S.ranked=r.list;S.t=r.t;}
      else { S.view='new'; }
    } else if(!S.draft||!S.draft.text){ S.view='new'; }
    if(S.view==='detail'&&!S.chosen)S.view='results';
  }
  if((S.view==='compliance'||S.view==='reports'||S.view==='onay')&&!S.chosen){
    if(S.ranked&&S.ranked.length)S.chosen=S.ranked[0]; else S.view='home';
  }
  if(S.view!=='gate') kaydet();
  if(S.view==='nsosyal'){root.innerHTML=vNsosyal();bind();return;}
  if(S.view==='gate'){root.innerHTML=vGate();bind();return;}
  const f=VIEWS[S.view]||vHome;
  root.innerHTML=shell(f());
  bind();
}

function bind(){
  const $=i=>document.getElementById(i),on=(i,f)=>{const e=$(i);if(e)e.addEventListener('click',f);};

  on('goAhi',()=>{S.view='gate';S.gate=1;render();});
  on('goAhi2',()=>{S.view='gate';S.gate=1;render();});
  on('rBrand',()=>{S.role='brand';S.eligInputs={followers:'',age:'',engagement:''};render();});
  on('rCreator',()=>{S.role='creator';S.eligInputs={followers:'',age:'',engagement:''};render();});
  on('gNext',()=>{S.gate=2;render();});
  on('gBack',()=>{S.gate=1;render();});
  ['eFol','eAge','eEng'].forEach(id=>{const e=$(id);if(e)e.addEventListener('input',()=>{
    S.eligInputs.followers=($('eFol')&&$('eFol').value)||'';
    S.eligInputs.age=($('eAge')&&$('eAge').value)||'';
    S.eligInputs.engagement=($('eEng')&&$('eEng').value)||'';
    const pos=e.selectionStart;render();
    const n=document.getElementById(id);if(n){n.focus();n.setSelectionRange(pos,pos);}});});
  on('gNext2',()=>{S.gate=3;S.code=['','','','','',''];S.gateErr=false;render();});
  on('gBack2',()=>{S.gate=2;render();});
  on('gPaste',()=>{S.code=['4','8','2','1','7','3'];S.gateErr=false;render();});
  on('gVerify',()=>{
    if(S.code.some(d=>!/^[0-9]$/.test(d))){S.gateErr=true;render();return;}
    S.view=S.role==='brand'?'home':'cpanel';kaydet();render();});
  [0,1,2,3,4,5].forEach(i=>{const e=$('c'+i);if(!e)return;
    e.addEventListener('input',ev=>{
      const v=ev.target.value.replace(/[^0-9]/g,'').slice(-1);
      S.code[i]=v;S.gateErr=false;
      if(v&&i<5){const n=$('c'+(i+1));if(n)n.focus();}
      render();
      const foc=document.getElementById('c'+Math.min(i+(v?1:0),5));if(foc)foc.focus();
    });
    e.addEventListener('keydown',ev=>{
      if(ev.key==='Backspace'&&!ev.target.value&&i>0){
        const p=$('c'+(i-1));if(p){p.focus();}
      }
    });
  });

  document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>{
    S.view=b.dataset.nav;S.compare=false;render();}));
  on('swap',()=>{S.role=S.role==='brand'?'creator':'brand';
    S.view=S.role==='brand'?'home':'cpanel';render();});
  on('exitAhi',()=>{S.view='nsosyal';render();});
  on('resetDemo',()=>{if(confirm('Demo verileri sıfırlansın mı?'))sifirla();});

  on('toNew',()=>{S.view='new';render();});
  on('cekBekleyen',()=>{
    if(!confirm('Yanıtlanmamış teklifler geri çekilsin mi?'))return;
    S.campaigns=S.campaigns.filter(c=>c.status!=='teklif bekliyor');
    kaydet();render();});
  const oku=()=>{const t=$('bt'),c=$('cty'),k=$('cmp2');
    if(t)S.draft.text=t.value;
    S.draft.city=c?(c.value||null):S.draft.city;
    S.draft.campaign=k?k.value:S.draft.campaign;
    const nt=$('notes');if(nt)S.draft.notes=nt.value;
    const kg=$('kati');if(kg)S.draft.katiGeo=(kg.value==='hard');
    if(S.draft.campaign==='cash'&&!S.draft.budget)S.draft.budget=[2000,4000];
    if(S.draft.campaign==='barter')S.draft.budget=null;};

  document.querySelectorAll('[data-camp]').forEach(b=>b.addEventListener('click',()=>{
    const i=+b.dataset.camp;S.openCampaign=S.openCampaign===i?null:i;render();}));
  on('closeCamp',()=>{S.openCampaign=null;render();});
  // Yeniden çizimden önce formdaki değerler okunmalı; aksi hâlde kullanıcının
  // yazdığı brif metni kaybolur.
  document.querySelectorAll('[data-ct]').forEach(b=>b.addEventListener('click',()=>{
    oku();S.draft.contentType=b.dataset.ct;S.fiyatDegisti=true;kaydet();render();}));
  on('detect',()=>{oku();const d=nisBul(S.draft.text);S.detect=d;
    if(!d.kapsamDisi)S.draft.niche=d.nis;render();});
  on('run',()=>{oku();
    if(!S.detect||S.detect.kapsamDisi){const d=nisBul(S.draft.text);S.detect=d;
      if(d.kapsamDisi){render();return;}S.draft.niche=d.nis;}
    const r=pipeline(S.draft);S.ranked=r.list;S.t=r.t;S.selected=[];
    S.view='results';render();});
  document.querySelectorAll('[data-sc]').forEach(b=>b.addEventListener('click',()=>{
    const s=D.scenarios.find(x=>x.id===b.dataset.sc);
    S.brandName=s.brand;
    S.draft={text:s.text,niche:s.niche,city:s.city||null,campaign:s.campaign,
             budget:s.budget||null,barterItem:s.barterItem||'ürününüzden bir örnek',
             barterValue:s.barterValue||1500,
             contentType:ctKod(s.contentType), notes:s.notes||''};
    S.detect={nis:s.niche,z:99,eslesme:9,kapsamDisi:false,ikinciNis:s.niche};
    S.learned={};S.relearned=false;kaydet();render();}));

  on('cmp',()=>{S.compare=!S.compare;S.kanit=null;render();});
  document.querySelectorAll('[data-kanit]').forEach(b=>b.addEventListener('click',()=>{
    S.kanit=S.kanit===b.dataset.kanit?null:b.dataset.kanit;render();}));
  on('kanitKapat',()=>{S.kanit=null;render();});
  document.querySelectorAll('[data-is]').forEach(b=>b.addEventListener('click',()=>{
    S.acikIs=S.acikIs===b.dataset.is?null:b.dataset.is;render();}));
  on('isKapat',()=>{S.acikIs=null;render();});
  on('hesapGor',()=>{S.hesapAcik=!S.hesapAcik;render();});
  document.querySelectorAll('[data-yenile]').forEach(b=>b.addEventListener('click',()=>{
    const i=S.campaigns.findIndex(c=>c.id===b.dataset.yenile);
    if(i>=0){S.campaigns[i].status='onay bekliyor';S.campaigns[i].revizyonNotu=null;
             S.aktifKampanya=S.campaigns[i].id;}
    kaydet();render();}));
  document.querySelectorAll('[data-vazgec]').forEach(b=>b.addEventListener('click',()=>{
    if(!confirm('Bu işten çekilmek istediğinize emin misiniz?'))return;
    S.campaigns=S.campaigns.filter(c=>c.id!==b.dataset.vazgec);
    S.acikIs=null;kaydet();render();}));
  on('again',()=>{S.view='new';render();});
  document.querySelectorAll('[data-i]').forEach(b=>b.addEventListener('click',()=>{
    S.chosen=S.ranked[+b.dataset.i];S.view='detail';render();}));
  document.querySelectorAll('[data-sel]').forEach(b=>b.addEventListener('change',()=>{
    const i=+b.dataset.sel,k=S.selected.indexOf(i);
    if(k<0)S.selected.push(i);else S.selected.splice(k,1);render();}));
  on('bulk',()=>{
    S.selected.forEach(i=>{const r=S.ranked[i];
      S.campaigns.unshift({id:'k'+Date.now()+i,brand:S.brandName,
        creator:'@'+r.c.handle,niche:S.draft.niche,contentType:S.draft.contentType,type:S.draft.campaign,
        status:'teklif bekliyor',date:new Date().toLocaleDateString('tr-TR'),
        reach:0,engagement:0,clicks:0,compliant:null});});
    S.chosen=S.ranked[S.selected[0]];S.selected=[];
    S.role='creator';S.view='coffers';kaydet();render();});
  on('toList',()=>{S.view='results';render();});
  on('offer',()=>{
    const yeniId='k'+Date.now();
    S.aktifKampanya=yeniId;
    S.campaigns.unshift({id:yeniId,brand:S.brandName,
      creator:'@'+S.chosen.c.handle,niche:S.draft.niche,contentType:S.draft.contentType,notes:S.draft.notes,
      type:S.draft.campaign,status:'teklif bekliyor',
      date:new Date().toLocaleDateString('tr-TR'),reach:0,engagement:0,clicks:0,compliant:null});
    S.role='creator';S.view='coffers';render();});

  document.querySelectorAll('#prefs button').forEach(b=>b.addEventListener('click',()=>{
    const k=b.dataset.cat,i=S.rejected.indexOf(k);
    if(i<0)S.rejected.push(k);else S.rejected.splice(i,1);render();}));
  on('openOffer',()=>{S.view='offer';render();});
  on('rej',()=>{
    S.campaigns=S.campaigns.filter(c=>c.id!==S.aktifKampanya);
    S.aktifKampanya=null;S.view='coffers';kaydet();render();});
  on('acc',()=>{
    const i=S.campaigns.findIndex(c=>c.id===S.aktifKampanya);
    if(i>=0)S.campaigns[i].status='kabul edildi';
    S.view='compliance';S.label='';S.checked=false;kaydet();render();});
  on('chk',()=>{S.label=($('lb').value||'').trim()||'#işbirliği';S.checked=true;render();});
  on('pub',()=>{
    const i=S.campaigns.findIndex(c=>c.id===S.aktifKampanya);
    if(i>=0){S.campaigns[i].status='onay bekliyor';S.campaigns[i].compliant=true;
             S.campaigns[i].revizyonNotu=null;}
    S.role='brand';S.view='onay';S.onayDurumu=null;S.onayNotu='';kaydet();render();});
  on('revizyon',()=>{const n=$('onayNot');S.onayNotu=n?n.value:'';
    const i=S.campaigns.findIndex(c=>c.id===S.aktifKampanya);
    if(i>=0){S.campaigns[i].status='revizyon istendi';
             S.campaigns[i].revizyonNotu=S.onayNotu||'Marka içerikte değişiklik istedi.';}
    S.onayDurumu='revizyon';kaydet();render();});
  on('revizyonGeldi',()=>{S.onayDurumu='guncellendi';render();});
  on('onayla',()=>{
    const i=S.campaigns.findIndex(c=>c.id===S.aktifKampanya);
    if(i>=0){S.campaigns[i].status='tamamlandı';S.campaigns[i].reach=0;}
    S.view='reports';kaydet();render();});
  on('pdf',()=>window.print());
  on('backBrand',()=>{S.role='brand';S.view='home';kaydet();render();});
  on('re',()=>{
    const once=pipeline(S.draft).list;
    S.oncekiSira=once.findIndex(r=>r.c.id===creatorSelf().id)+1||'50+';
    S.learned[creatorSelf().id]=6;
    const sonra=pipeline(S.draft).list;
    S.yeniSira=sonra.findIndex(r=>r.c.id===creatorSelf().id)+1||'50+';
    S.ranked=sonra;S.relearned=true;render();});

  ['fNiche','fCity'].forEach(id=>{const e=$(id);if(e)e.addEventListener('change',()=>{
    S.dataFilter[id==='fNiche'?'niche':'city']=e.value;render();});});
  const fq=$('fQ');if(fq)fq.addEventListener('input',()=>{S.dataFilter.q=fq.value;
    const p=fq.selectionStart;render();const n=document.getElementById('fQ');
    if(n){n.focus();n.setSelectionRange(p,p);}});
}
if(yukle()){ if(!S.view) S.view='nsosyal'; }
/* ---------------- sunum kısayolları ----------------
   Sahnede giriş adımlarına takılmamak için. Jüri isterse giriş akışı
   ayrıca gösterilir; bu kısayol yalnızca zaman kazandırır.
     D → doğrudan kampanya oluşturma ekranı (marka rolü)
     R → demoyu baştan başlat                                        */
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select'))return;
  const k=e.key.toLowerCase();
  if(k==='d'){
    S.role='brand';S.view='new';S.draft={text:'',niche:null,city:null,
      campaign:'barter',budget:null,contentType:'gorsel',notes:'',katiGeo:false,barterItem:'ürününüzden bir örnek',barterValue:1500};
    S.detect=null;S.ranked=[];S.chosen=null;S.compare=false;kaydet();render();
  }
  if(k==='r'){sifirla();}
});

render();
</script>
</body>
</html>
